<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>심리상담 AI</title>
    <style id="critical-shell-style">
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f6f8;
        color: #18201d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, textarea { font: inherit; }
      .appShell {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        min-height: 100vh;
        background: #ffffff;
      }
      .topBar, .modeBar, .messages, .composer { padding-left: 28px; padding-right: 28px; }
      .topBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-top: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #d8e0dd;
      }
      h1 { margin: 0; font-size: 28px; line-height: 1.15; }
      .eyebrow { margin: 0 0 4px; color: #61706b; font-size: 13px; }
      .modeBar { display: flex; gap: 8px; padding-top: 14px; padding-bottom: 14px; border-bottom: 1px solid #d8e0dd; }
      .modeButton, .ghostButton, .statusPill {
        border: 1px solid #d8e0dd;
        border-radius: 8px;
        background: #fff;
        color: #61706b;
        padding: 8px 12px;
      }
      .message {
        max-width: 780px;
        margin: 24px 0 18px;
        padding: 16px 18px;
        border: 1px solid #d8e0dd;
        border-radius: 8px;
        background: #fbfcfc;
      }
      .speaker { display: block; margin-bottom: 8px; color: #61706b; font-size: 13px; }
      .message p { margin: 0; line-height: 1.55; }
      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 112px;
        gap: 12px;
        padding-top: 18px;
        padding-bottom: 24px;
        border-top: 1px solid #d8e0dd;
      }
      .composer textarea {
        width: 100%;
        min-height: 76px;
        padding: 12px;
        border: 1px solid #d8e0dd;
        border-radius: 8px;
      }
      .composer button { border: 0; border-radius: 8px; background: #126b5f; color: #fff; font-weight: 700; }
      @media (max-width: 640px) {
        .topBar, .modeBar, .messages, .composer { padding-left: 16px; padding-right: 16px; }
        .topBar, .composer { display: flex; flex-direction: column; align-items: stretch; }
        .composer button { min-height: 44px; }
      }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="appShell">
      <section class="chatPane" aria-label="상담 대화">
        <header class="topBar">
          <div>
            <p class="eyebrow">AIHub 71806 기반 상담 보조</p>
            <h1>심리상담 AI</h1>
          </div>
          <div class="topActions">
            <button class="ghostButton" id="insightToggle" type="button" aria-controls="insightPane" aria-expanded="false">분석 보기</button>
            <div class="statusPill" id="statusPill">로딩 중</div>
          </div>
        </header>

        <div class="modeBar" role="tablist" aria-label="상담 모드">
          <button class="modeButton active" data-mode="free" type="button">자유 상담</button>
          <button class="modeButton" data-mode="emotion" type="button">감정 정리</button>
          <button class="modeButton" data-mode="cognitive" type="button">인지재구성</button>
          <button class="modeButton" data-mode="action" type="button">행동 계획</button>
          <button class="modeButton" data-mode="crisis" type="button">위기 안정화</button>
        </div>

        <div class="messages" id="messages">
          <article class="message assistant">
            <span class="speaker">상담 AI</span>
            <p>지금 어떤 일이 가장 힘든지 편하게 적어주세요. 저는 확정 진단이 아니라 가능성, 강도, 조치, 상담 보조를 구조화해서 도와드립니다.</p>
          </article>
        </div>

        <form class="composer" id="composer">
          <textarea id="messageInput" rows="3" placeholder="예: 요즘 불안하고 잠을 잘 못 자요." required></textarea>
          <button type="submit">보내기</button>
        </form>
      </section>

      <aside class="insightPane" id="insightPane" aria-label="평가 및 조치" hidden>
        <section class="panel riskPanel">
          <h2>지원 강도</h2>
          <div class="riskValue" id="riskValue">대기</div>
          <p id="safetyMessage">대화를 시작하면 현재 강도와 안전 안내가 표시됩니다.</p>
        </section>

        <section class="panel">
          <h2>가능성 분류</h2>
          <div class="conditionGrid" id="conditionGrid"></div>
        </section>

        <section class="panel">
          <h2>권고 조치</h2>
          <ul class="actionList" id="actionList">
            <li>상담 메시지를 입력하면 조치가 표시됩니다.</li>
          </ul>
        </section>

        <section class="panel">
          <h2>상담 세션</h2>
          <h3 id="sessionTitle">대기</h3>
          <ol class="stepList" id="stepList">
            <li>모드를 선택하고 대화를 시작하세요.</li>
          </ol>
        </section>

        <section class="panel evidencePanel">
          <h2>근거 및 데이터 상태</h2>
          <pre id="evidenceText">AIHub 자료 상태를 확인 중입니다.</pre>
        </section>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
